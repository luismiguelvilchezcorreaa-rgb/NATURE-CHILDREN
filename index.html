<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nature Explorers • English with Lui</title><style>
:root{--bg:#07152b;--panel:#112544;--ink:#f4f8ff;--muted:#bacbe2;--blue:#5cabff;--green:#97f6c3;--purple:#b5a0ff}*{box-sizing:border-box}body{margin:0;font:20px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--ink)}header,main,footer{max-width:1120px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-weight:850;color:var(--green)}h1{font-size:clamp(36px,6vw,66px);line-height:1.1;margin:12px 0}h2{font-size:32px;line-height:1.25}h3{font-size:24px}p{margin:12px 0}.hero{background:linear-gradient(120deg,#12375c,#302963);padding:32px;border-radius:26px}.hero .rabbit{font-size:90px;float:right}button,select,input,textarea{font:inherit}button{border:2px solid transparent;border-radius:14px;padding:12px 20px;background:var(--blue);color:#07152b;font-weight:750;cursor:pointer;min-height:48px}button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:4px}button:disabled{cursor:default;opacity:.65}.ghost{background:transparent;border-color:#7294bf;color:var(--ink)}.pill{font-size:16px;color:var(--green);letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px;margin-top:24px}.card{background:var(--panel);padding:24px;border-radius:20px;border:1px solid #294568}.tile{text-align:left;width:100%;color:var(--ink)}.tile span{display:block;font-size:42px}.tile small{display:block;font-weight:400;color:var(--muted)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.big{font-size:clamp(25px,4vw,34px);line-height:1.45}.visual{font-size:85px;text-align:center}.options{display:grid;gap:14px;margin:24px 0}.option{text-align:left;background:#1b375a;color:white;border-color:#46668f}.right{border-color:var(--green)!important;background:#144731!important}.wrong{border-color:#ffaea6!important;background:#663a48!important}.feedback{min-height:56px;color:var(--green);font-weight:700}.reading{background:#f4f8ff;color:#132744;border-radius:18px;padding:24px;font-size:23px}.reading p{margin:0 0 18px}details{background:#193454;border-radius:12px;padding:12px;margin:16px 0}summary{cursor:pointer;font-weight:700}input,textarea,select{width:100%;background:#f4f8ff;color:#102744;border:2px solid #7e9bc2;border-radius:12px;padding:12px}textarea{min-height:220px}label{display:block;margin:12px 0}.word{background:#263f68;color:white}.slots{min-height:80px;background:#07152b;padding:16px;border-radius:14px;margin:16px 0}.small{font-size:16px}.meter{height:8px;background:#355176;border-radius:10px;overflow:hidden;margin:14px 0}.meter i{display:block;height:100%;background:var(--green)}footer{font-size:16px;color:var(--muted)}.hidden{display:none}.badge{background:#253658;border-radius:40px;padding:8px 16px;color:var(--green)}@media(max-width:600px){header,main,footer{padding:16px}.hero{padding:24px}.hero .rabbit{font-size:65px}.card{padding:20px}button{padding:12px 16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><div class="brand">🌿 NATURE EXPLORERS <span class="muted small">/ English with Lui</span></div><div class="row"><span id="progress" class="badge" aria-live="polite"></span><button class="ghost" id="home">Home</button><button class="ghost" id="fullscreen">Full screen</button></div></header><main id="app"></main><footer>For ages 10–12 • A1–A2 • Learn, play and tell your own story.</footer>
<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let saved={};try{saved=JSON.parse(localStorage.getItem('nature-lui-v1')||'{}')||{}}catch(e){}saved.done=Array.isArray(saved.done)?saved.done:[];
function persist(){try{localStorage.setItem('nature-lui-v1',JSON.stringify(saved))}catch(e){}}function complete(id){if(!saved.done.includes(id))saved.done.push(id);persist();progress()}function progress(){$('#progress').textContent=`${saved.done.length} / 9 missions complete`}progress();
const animals=[['🐄','cow','A farm animal that gives us milk.'],['🐘','elephant','A very large animal with a trunk.'],['🦒','giraffe','An animal with a very long neck.'],['🐎','horse','People can ride this animal.'],['🦎','lizard','A small reptile.'],['🦓','zebra','An animal with black and white stripes.'],['🐇','rabbit','An animal with long ears.'],['🐑','sheep','A farm animal with wool.'],['🐐','goat','A farm animal that can have horns.'],['🐒','chimpanzee','An ape with hands that can hold things.'],['🐁','mouse','A very small animal with a long thin tail.'],['🐈','cat','A pet that can say meow.']];
// Emoji are visual hints; the labels and definitions identify the exact animals.
const nature=[['🏖️','beach','A place beside the sea.'],['⏳','sand','Tiny grains on a beach.'],['🌊','sea','A large area of salt water.'],['☀️','sun','It gives Earth light and warmth.'],['🌳','tree','A tall plant with a trunk.'],['💧','water','Animals need it to drink.'],['🌲','forest','A place with many trees.']];
const phrases=[['🛏️','get up','Leave your bed.'],['🤲','take care of','Look after a person or animal.'],['⬆️','pick up','Lift something.'],['🚒','put out','Stop a fire from burning.'],['⏰','wake up','Stop sleeping.']];
const nouns=[['🏠','cage','A home with bars for a small animal.'],['🔥','fire','Something burning.'],['🚒','firefighter','A person trained to put out fires.'],['🏅','hero','Someone who helps or saves others.'],['🔊','noise','A sound, often a loud one.'],['👃','smell','Something you notice with your nose.'],['🌫️','smoke','It rises when something burns.'],['🥕','vegetables','Carrots and other plants we eat.'],['🔁','again and again','Many times.'],['☎️','call the fire department','Contact the people who handle fires.'],['🛟','save','Help someone escape danger.'],['😟','terrible','Very bad.']];
const verbs=[['run','ran'],['take','took'],['think','thought'],['understand','understood'],['eat','ate'],['say','said'],['bring','brought'],['wake','woke'],['get','got'],['go','went'],['come','came'],['ride','rode'],['see','saw'],['make','made'],['have','had']];
const story=`<p>Cupcake was the Horton family's pet rabbit. He ate vegetables in Dad's garden, so the family brought his cage into Jane's bedroom. Jane took care of him.</p><p>One night, Cupcake kicked his cage again and again. The noise woke Jane up. She picked Cupcake up and went downstairs. She smelled smoke and saw a fire in the kitchen.</p><p>Jane woke her parents up. They called the fire department. The firefighters came quickly and put out the fire. Cupcake became the family's hero. Dad gave him delicious vegetables.</p>`;
const listen=[['chimpanzee','Last summer, I went to the zoo with my dad. I saw a clever animal with long arms and no tail. It climbed a tree and ate some fruit. Then it held a banana in its hand. We thought it was amazing.','What did it eat?','Fruit and a banana.'],['cat','Yesterday, I saw a small animal in our garden. It had soft fur and long whiskers. It came into the kitchen and made a quiet meow. I gave it some water. Then it slept beside my chair. I thought it was cute.','Where did it sleep?','Beside the chair.'],['sheep','Last weekend, I went to a farm with my cousin. We saw a white animal with thick wool. It ate grass near a tree and made a loud baa. The farmer brought it some water. We took a photo before we went home.','What did the farmer bring?','Some water.'],['rabbit','Yesterday, my friend showed me her pet. It had two long ears and a little nose. It hopped across the room and ate a carrot. We made sure it had clean water. Then my friend took care of its cage. I liked it a lot.','What did it eat?','A carrot.']];
const Q=(q,a,b,c,ex)=>({q,options:[a,b,c],a,ex});
const vocabQs=[Q('Which animal has a very long neck?','giraffe','cow','lizard','A giraffe has a long neck.'),Q('Which animal has black and white stripes?','zebra','horse','elephant','A zebra has stripes.'),Q('Which animal has a trunk?','elephant','rabbit','sheep','An elephant has a trunk.'),Q('Which animal gives us wool?','sheep','cat','mouse','Sheep have wool.'),Q('Which word means a place with many trees?','forest','sand','sea','A forest has many trees.'),Q('What gives us light during the day?','sun','water','sand','The sun gives us light.'),Q('Carrots are ___.','vegetables','animals','trees','Carrots are vegetables.'),Q('What do we notice with our nose?','smell','noise','cage','We notice smells with our nose.'),Q('What means many times?','again and again','last night','yesterday','Again and again means repeatedly.'),Q('Who is trained to put out fires?','a firefighter','a rabbit','a horse','Firefighters are trained to handle fires.')];
const readingQs=[Q('Who was Cupcake?','A pet rabbit','A firefighter','A cat','Cupcake was the Horton family’s pet rabbit.'),Q('What did Cupcake eat in the garden?','Vegetables','Cake','Sand','He ate vegetables in Dad’s garden.'),Q('Where was his cage?','In Jane’s bedroom','At the zoo','On the beach','His cage was in Jane’s bedroom.'),Q('How did Cupcake wake Jane?','He kicked his cage','He spoke to her','He opened a door','He kicked his cage again and again.'),Q('What did Jane smell downstairs?','Smoke','Flowers','Chocolate','Jane smelled smoke.'),Q('Where was the fire?','In the kitchen','In the garden','In the forest','The fire was in the kitchen.'),Q('Who called the fire department?','Jane’s parents','Cupcake','Jane’s teacher','Jane’s parents called the fire department.'),Q('Who put out the fire?','The firefighters','Jane','Cupcake','Firefighters put out the fire.')];
const phraseQs=[Q('I ___ at seven and leave my bed.','get up','pick up','put out','Get up means leave your bed.'),Q('I ___ when the alarm rings. Then I open my eyes.','wake up','take care of','put out','Wake up means stop sleeping.'),Q('We ___ our rabbit and give it food.','take care of','get up','wake up','Take care of means look after.'),Q('Please ___ the book from the floor.','pick up','put out','get up','Pick up means lift something.'),Q('Firefighters ___ fires.','put out','wake up','take care of','Put out means stop a fire burning.'),Q('The loud noise ___ Jane last night.','woke up','wake up','waking up','Wake → woke. The noise woke Jane up.'),Q('Yesterday, I ___ at eight and left my bed.','got up','get up','getting up','Get → got. I got up.'),Q('Choose the correct sentence.','I take care of my rabbit.','I take my rabbit care of.','I care my rabbit take of.','Keep take care of together.'),Q('Choose the correct sentence.','She picked it up.','She picked up it.','She pick it up yesterday.','With it, use picked it up.'),Q('Choose the correct sentence.','The noise woke her up.','The noise woke up her.','The noise wake her yesterday.','With her, use woke her up.')];
const grammarQs=[Q('Yesterday, the rabbit ___ a carrot.','ate','eated','eat','Eat → ate.'),Q('Jane ___ a rabbit in the garden yesterday.','saw','seed','see','See → saw.'),Q('We ___ to a farm last summer.','went','goed','go','Go → went.'),Q('Dad ___ the cage into the house yesterday.','brought','bringed','bring','Bring → brought.'),Q('She ___, “My rabbit is cute.”','said','sayed','say','Say → said.'),Q('They ___ horses last weekend.','rode','rided','ride','Ride → rode.'),Q('The firefighters ___ quickly last night.','came','comed','come','Come → came.'),Q('I ___ my pet had enough water yesterday.','made sure','maked sure','make sure','Make → made.'),Q('The children ___ home yesterday.','ran','runned','run','Run → ran.'),Q('Jane ___ Cupcake downstairs last night.','took','taked','take','Take → took.')];
const missions=[['learn','🔍','Discover words','Explore animals, nature and story words.'],['vocab','🦒','Word detective','Solve 10 vocabulary clues.'],['read','🐇','Cupcake the hero','Read, predict and answer 8 questions.'],['sequence','🧩','Story order','Put 6 events in the right order.'],['phrasal','🎭','Action lab','Learn 5 phrases and solve 10 tasks.'],['grammar','⚡','Past-tense lab','Meet 15 verbs, match and practise.'],['build','🛠️','Sentence builder','Build 8 past-tense sentences.'],['listen','🎧','Listening mission','Match 4 new stories to animals.'],['create','✍️','Your adventure','Speak, write and take the final quiz.']];
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function say(t){if(!('speechSynthesis'in window)){alert('Audio is unavailable. Open the transcript and ask your teacher to read.');return}stop();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;let v=speechSynthesis.getVoices().find(v=>v.lang==='en-US');if(v)u.voice=v;speechSynthesis.speak(u)}
function frame(title,sub,html){stop();app.innerHTML=`<div class="pill">Learning mission</div><h1>${title}</h1><p class="muted">${sub}</p>${html}`;window.scrollTo(0,0)}
function home(){stop();app.innerHTML=`<section class="hero"><div class="rabbit" aria-hidden="true">🐇</div><div class="pill">Unit 6 • Three learning adventures</div><h1>Small rabbit.<br>Big adventure.</h1><p class="big">Explore nature. Discover a hero.<br>Tell a story about yesterday.</p><p>Choose a mission below. Learn first, then play!</p></section><div class="grid">${missions.map(([id,icon,title,desc])=>`<button class="card tile" data-go="${id}"><span>${icon}</span>${title}<small>${desc}</small><small>${saved.done.includes(id)?'✓ Complete':'Ready to explore'}</small></button>`).join('')}</div><details><summary>Teacher corner</summary><p>Lesson 1: missions 1–4. Lesson 2: missions 5–7. Lesson 3: missions 8–9. Suggested time: 45–50 minutes per lesson. Pause for pair work and allow retries.</p><p>Closed tasks give immediate feedback. Speaking and writing use self-checks, not automatic grammar grading. Progress and writing stay in this browser when storage is available.</p><p>Listening stories are original practice materials, not the textbook audio. Voices depend on the device. Each story has a transcript for teacher reading.</p><p>Emoji are hints, not accurate animal photographs. Read labels and definitions, especially for chimpanzee.</p><p>Fire story: children should leave safely and tell an adult. Firefighters handle real fires.</p><button class="ghost" id="reset">Reset my progress and writing</button></details>`;app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#reset').onclick=()=>{if(confirm('Clear all progress and writing on this browser?')){saved={done:[]};persist();progress();home()}}}
$('#home').onclick=home;$('#fullscreen').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>{})}};
function cards(data){return `<div class="grid">${data.map(([ic,w,d])=>`<div class="card"><div class="visual" aria-hidden="true">${ic}</div><h3>${esc(w)}</h3><p>${esc(d)}</p><button class="ghost small" data-say="${esc(w)}" aria-label="Listen to ${esc(w)}">🔊 Listen</button></div>`).join('')}</div>`}function bindAudio(){app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say))}
function go(id){if(id==='learn'){frame('Discover words','Look, read and say each word.',`<div class="row">${['Animals','Nature','Story words'].map(x=>`<button class="ghost" data-set="${x}">${x}</button>`).join('')}</div><div id="cards"></div><p class="big">I can see ___. My favorite animal is ___ because it is ___.</p><button id="done">I explored the words ✓</button>`);function set(n){$('#cards').innerHTML=cards(n==='Animals'?animals:n==='Nature'?nature:nouns);bindAudio()}app.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>set(b.dataset.set));set('Animals');$('#done').onclick=()=>{complete(id);home()}}
else if(id==='vocab')quiz(id,vocabQs);
else if(id==='read'){frame('Cupcake the hero','Before reading: how can a rabbit help a family?',`<div class="visual">🐇 🥕 🛏️ 🚒</div><article class="reading">${story}</article><p class="small muted">A short adaptation of the supplied reading. In a real fire, leave safely and tell an adult. Firefighters handle fires.</p><details><summary>Word help</summary><p>cage = a home with bars; smoke = what rises when something burns; again and again = many times; hero = someone who helps others.</p></details><button id="readquiz">Start reading detective</button>`);$('#readquiz').onclick=()=>quiz(id,readingQs,`<details><summary>Read the story again</summary><article class="reading">${story}</article></details>`)}
else if(id==='sequence')sequence();
else if(id==='phrasal'){frame('Action lab','Act, notice and practise.',cards(phrases)+`<div class="card"><h2>Wake up ≠ get up</h2><p class="big">I wake up. → I stop sleeping.<br>I get up. → I leave my bed.</p><p>Pick the rabbit up. → Pick it up.<br>Wake Jane up. → Wake her up.</p></div><button id="pq">Start action challenge</button>`);bindAudio();$('#pq').onclick=()=>quiz(id,phraseQs)}
else if(id==='grammar')grammar();else if(id==='build')builder();else if(id==='listen')listening();else if(id==='create')create()}
function quiz(id,items,extra=''){let list=shuffle(items),i=0,score=0;function draw(){if(i===list.length){frame('Mission report',`${score} / ${list.length} correct on your first try.`, `<div class="card"><div class="visual">${score===list.length?'🏆':'🌟'}</div><p class="big">${score===list.length?'Amazing work!':'Keep exploring. Every mistake helps you learn.'}</p><button id="retry">Try again</button> <button id="finish">Finish mission ✓</button></div>`);$('#retry').onclick=()=>quiz(id,items,extra);$('#finish').onclick=()=>{complete(id);home()};return}let q=list[i];frame(missions.find(m=>m[0]===id)[2],`Question ${i+1} of ${list.length}`,`${extra}<div class="meter"><i style="width:${i/list.length*100}%"></i></div><section class="card"><p class="big">${esc(q.q)}</p><div class="options">${shuffle(q.options).map(o=>`<button class="option" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div><p class="feedback" id="feedback" role="status"></p><button id="next" disabled>Next →</button></section>`);let first=true;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(b.dataset.answer===q.a){if(first)score++;b.classList.add('right');$('#feedback').textContent='✓ '+q.ex;app.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);$('#next').disabled=false}else{first=false;b.classList.add('wrong');b.disabled=true;$('#feedback').textContent='Try another answer. Read the sentence again.'}});$('#next').onclick=()=>{i++;draw()}}draw()}
function sequence(){const events=['Cupcake ate vegetables in Dad’s garden.','The family brought his cage into Jane’s bedroom.','Cupcake kicked his cage and woke Jane up.','Jane went downstairs and saw a fire.','Jane woke her parents. They called the fire department.','The firefighters came and put out the fire.'];let pool=shuffle(events.map((t,i)=>({t,i}))),chosen=[];frame('Story order','Tap the events in the order they happened.',`<div id="order"></div><div id="pool" class="options"></div><p id="fb" class="feedback" role="status"></p><div class="row"><button id="undo" class="ghost">Undo</button><button id="check">Check order</button><button id="finish" class="ghost hidden">Finish mission ✓</button></div>`);function draw(){$('#order').innerHTML=`<ol class="card">${chosen.map(x=>`<li>${esc(x.t)}</li>`).join('')}</ol>`;$('#pool').innerHTML=pool.map(x=>`<button class="option" data-index="${x.i}">${esc(x.t)}</button>`).join('');app.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{let p=pool.findIndex(x=>x.i===Number(b.dataset.index));chosen.push(pool.splice(p,1)[0]);$('#fb').textContent='';draw()})}draw();$('#undo').onclick=()=>{if(chosen.length)pool.push(chosen.pop());$('#fb').textContent='';draw()};$('#check').onclick=()=>{let ok=chosen.length===6&&chosen.every((x,i)=>x.i===i);$('#fb').textContent=ok?'✓ You rebuilt the story!':chosen.length<6?'Choose all six events first.':'Some events are out of order. Undo and try again.';if(ok){$('#finish').classList.remove('hidden');$('#check').disabled=true;$('#undo').disabled=true}};$('#finish').onclick=()=>{complete('sequence');home()}}
function grammar(){frame('Past-tense lab','We use the simple past for completed past actions.',`<div class="card"><p class="big">Now: I eat carrots.<br>Yesterday: I <strong style="color:var(--green)">ate</strong> carrots.</p><p>Subject + past verb + more information</p><p>Regular: save → saved • Irregular: eat → ate</p><p>Time words: yesterday • last night • last summer</p></div><div class="grid">${verbs.map(([a,b])=>`<div class="card"><p class="big">${a} → <strong style="color:var(--green)">${b}</strong></p><button class="ghost small" data-say="${a}, ${b}">🔊 Listen</button></div>`).join('')}</div><p>Phrase forms: get up → got up; wake up → woke up; make sure → made sure.</p><button id="match">Match the verbs →</button>`);bindAudio();$('#match').onclick=match}
function match(){const pairs=shuffle(verbs).slice(0,8);let i=0;function draw(){if(i===pairs.length){quiz('grammar',grammarQs);return}let [base,past]=pairs[i];frame('Verb match',`Match ${i+1} of 8, then take the sentence challenge.`,`<div class="card"><p class="big">${base} → ?</p><div class="options">${shuffle([past,...shuffle(verbs.filter(v=>v[1]!==past)).slice(0,2).map(v=>v[1])]).map(v=>`<button class="option" data-past="${v}">${v}</button>`).join('')}</div><p id="fb" class="feedback" role="status"></p><button id="next" disabled>Next →</button></div>`);app.querySelectorAll('[data-past]').forEach(b=>b.onclick=()=>{if(b.dataset.past===past){b.classList.add('right');$('#fb').textContent=`✓ ${base} → ${past}`;app.querySelectorAll('[data-past]').forEach(x=>x.disabled=true);$('#next').disabled=false}else{b.disabled=true;b.classList.add('wrong');$('#fb').textContent='Try again. Think of the past form.'}});$('#next').onclick=()=>{i++;draw()}}draw()}
const sentences=['Yesterday I saw a rabbit','Jane took Cupcake downstairs','The rabbit ate a carrot','We went to a farm yesterday','The firefighters came quickly','Dad brought the cage inside','Last summer we rode horses','The noise woke Jane up'];
function builder(){let i=0,chosen=[],pool=[];function start(){chosen=[];pool=shuffle(sentences[i].split(' ').map((w,j)=>({w,j})));frame('Sentence builder',`Sentence ${i+1} of ${sentences.length}. Tap words in order.`, `<div class="card"><p class="muted">Use every word. The full stop is added for you.</p><div id="slots" class="slots big"></div><div id="words" class="row"></div><p id="fb" class="feedback" role="status"></p><div class="row"><button id="undo" class="ghost">Undo</button><button id="check">Check</button><button id="next" disabled>Next →</button></div></div>`);draw();$('#undo').onclick=()=>{if(chosen.length)pool.push(chosen.pop());$('#fb').textContent='';draw()};$('#check').onclick=()=>{if(chosen.map(x=>x.w).join(' ')===sentences[i]){$('#fb').textContent='✓ Great sentence!';$('#next').disabled=false;$('#undo').disabled=true;$('#check').disabled=true}else{$('#fb').textContent='Try again. Start with the subject or the time phrase.'}};$('#next').onclick=()=>{i++;if(i===sentences.length){complete('build');home()}else start()}}function draw(){$('#slots').textContent=chosen.map(x=>x.w).join(' ')+(chosen.length===sentences[i].split(' ').length?'.':'');$('#words').innerHTML=pool.map(x=>`<button class="word" data-token="${x.j}">${esc(x.w)}</button>`).join('');app.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{let j=pool.findIndex(x=>x.j===Number(b.dataset.token));chosen.push(pool.splice(j,1)[0]);draw()})}start()}
function listening(){frame('Listening mission','Listen twice. Match each speaker to an animal. Two animals are extra.',`<p class="muted">Four original practice stories. If audio is unavailable, ask your teacher to read the transcripts.</p><div class="grid">${listen.map(([a,t,q,ans],i)=>`<section class="card"><h2>Speaker ${i+1}</h2><button data-listen="${i}">▶ Listen</button><label for="a${i}">Choose the animal</label><select id="a${i}"><option value="">Choose…</option>${['sheep','rabbit','goat','chimpanzee','mouse','cat'].map(a=>`<option>${a}</option>`).join('')}</select><p id="f${i}" role="status"></p><details><summary>Transcript / teacher script</summary><p>${esc(t)}</p></details><details><summary>Extra detail question</summary><p>${q}</p><details><summary>Show answer</summary>${ans}</details></details></section>`).join('')}</div><p id="fb" class="feedback" role="status"></p><div class="row"><button id="stop" class="ghost">Stop audio</button><button id="check">Check matches</button><button id="finish" disabled>Finish mission ✓</button></div><p class="big">I liked the story about the ___ because ___.</p>`);app.querySelectorAll('[data-listen]').forEach(b=>b.onclick=()=>say(listen[Number(b.dataset.listen)][1]));$('#stop').onclick=stop;$('#check').onclick=()=>{let n=0;listen.forEach(([a],i)=>{let correct=$('#a'+i).value===a;n+=correct?1:0;$('#f'+i).textContent=correct?'✓ Correct!':'Listen again and check the clues.'});$('#fb').textContent=`${n} / 4 matches correct`;$('#finish').disabled=n!==4};$('#finish').onclick=()=>{complete('listen');home()}}
function create(){frame('Your animal adventure','Speak first. Then write 5–6 sentences.',`<div class="card"><h2>1. Tell a partner</h2><p class="big">Yesterday, I saw ___.<br>It ___. Then, I ___.<br>Finally, ___.</p><p>Choose an animal: rabbit • horse • cat • elephant.<br>Past verbs: saw • went • ate • took • came • had.</p><details><summary>One example</summary><p>Yesterday, I went to a farm. I saw a horse. It ate some grass. I took a photo.</p></details><button id="prompt">🎲 New speaking idea</button><p id="idea" class="big"></p></div><div class="card"><h2>2. Write your story</h2><label for="writing">Give it a title. Use at least 3 irregular past verbs.</label><textarea id="writing" placeholder="My animal adventure…"></textarea><p id="saveinfo" class="small muted"></p><div class="row"><button id="download">Download my story</button><button class="ghost" id="selfcheck">Check my progress</button></div><p id="counts" role="status"></p><p>Self-check: clear story • past verbs • sequence words • capitals and full stops.</p><label><input type="checkbox" id="spoken" style="width:auto"> I told my story to a partner.</label><label><input type="checkbox" id="reviewed" style="width:auto"> I reviewed my writing with the checklist.</label><p id="cfb" class="feedback" role="status"></p><button id="final">3. Final mixed challenge →</button></div>`);$('#writing').value=typeof saved.writing==='string'?saved.writing:'';$('#writing').oninput=()=>{saved.writing=$('#writing').value;persist();$('#saveinfo').textContent='Draft kept in this browser when storage is available.'};$('#prompt').onclick=()=>{$('#idea').textContent=`Yesterday, I went to ${shuffle(['a farm','a forest','the beach','a zoo'])[0]} and saw ${shuffle(['a rabbit','a horse','a cat','an elephant'])[0]}. What happened next?`};$('#selfcheck').onclick=()=>{let t=$('#writing').value,ws=t.trim().split(/\s+/).filter(Boolean),ss=t.match(/[^.!?]+[.!?]+/g)||[],used=verbs.map(v=>v[1]).filter(v=>new RegExp('\\b'+v+'\\b','i').test(t));$('#counts').textContent=`${ws.length} words • ${ss.length} sentences with end punctuation • ${used.length} different target past verbs: ${used.join(', ')||'none yet'}. Review your meaning and grammar with your teacher.`};$('#download').onclick=()=>{let b=new Blob([$('#writing').value],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='my-animal-adventure.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#final').onclick=()=>{if(!$('#spoken').checked||!$('#reviewed').checked||!$('#writing').value.trim()){$('#cfb').textContent='Write your story and complete the two self-checks first.';return}quiz('create',[vocabQs[4],readingQs[3],phraseQs[0],phraseQs[8],grammarQs[0],grammarQs[2]])}}
home();
</script></body></html>
